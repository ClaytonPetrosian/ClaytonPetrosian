name: StoreKit or RevenueCat launch review
description: Request the fixed-scope US$49 review of one mobile purchase path.
title: "Billing review request"
labels:
  - service-request
body:
  - type: markdown
    attributes:
      value: |
        I review one mobile paywall from button to entitlement and return a patch or a short evidence-backed report. I confirm scope, delivery time, and payment details before starting.

        Do not include passwords, API keys, Apple IDs, verification codes, signing files, or other private information.
  - type: input
    id: public_repo
    attributes:
      label: Public repository or branch
      description: A public repository, branch, or redacted implementation notes.
      placeholder: https://github.com/example/app/tree/billing-review
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and SDK
      description: For example, Expo SDK 54, React Native, SwiftUI, or Flutter.
      placeholder: Expo SDK 54 + React Native
    validations:
      required: true
  - type: textarea
    id: products
    attributes:
      label: Products and entitlements
      description: Product IDs and the entitlement or premium state that should unlock.
      placeholder: com.example.pro.monthly -> pro
    validations:
      required: true
  - type: input
    id: reply_email
    attributes:
      label: Reply email
      description: Where should I confirm scope and delivery time?
      placeholder: you@example.com
    validations:
      required: true
  - type: checkboxes
    id: public_scope
    attributes:
      label: Scope confirmation
      options:
        - label: The materials are public or redacted and contain no private credentials.
          required: true
